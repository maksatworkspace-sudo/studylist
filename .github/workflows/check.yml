name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Contract gate (issue #6): openapi.yml has not landed yet, so this step
      # reports an explicit PENDING annotation instead of pretending to pass.
      # Once #6 lands, contract tests run as part of `npm test` above.
      - name: Contract validation gate
        run: |
          if [ -f openapi.yml ]; then
            echo "openapi.yml present — contract coverage runs in the npm test step."
          else
            echo "::warning title=contract-pending::openapi.yml not delivered yet (issue #6 open) — contract validation is PENDING, not passed."
          fi
      # Isolated runner (issue #19): real app on a free loopback port with a
      # throwaway data directory. Strict mode: every phase (HTTP, browser,
      # restart) is required — a missing browser or configuration fails.
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Isolated strict verification (http + browser + restart)
        run: node scripts/verify.mts --strict
      - name: Isolated mock-mode browser verification (#5 zero API traffic)
        run: node scripts/verify.mts --phase e2e --mode mock --strict
      - name: Upload verification artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: verify-artifacts
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/
